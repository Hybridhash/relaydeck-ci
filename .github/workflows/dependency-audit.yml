name: Dependency audit

permissions:
  contents: read

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

env:
  UV_VERSION: "0.12.15"

jobs:
  audit:
    name: locked dependency vulnerability audit
    runs-on: macos-15
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.13"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Locked dependency resolution
        run: uv sync --locked --extra companion --group dev

      - name: Dependency vulnerability audit
        run: |
          uv export --locked --no-hashes --no-emit-project --extra companion --format requirements-txt > requirements-audit.txt
          uvx pip-audit==2.9.0 -r requirements-audit.txt --no-deps --disable-pip
