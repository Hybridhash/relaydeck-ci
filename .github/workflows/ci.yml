# RelayDeck CI: locked install, lint, format, static types, the Python and Flutter test suites,
# secret scan and licence inventory on each push. Tests run on macOS because the companion is a Mac
# service.
# Browser and device tests need hardware CI does not have.
# Packaging jobs build unsigned artifacts on manual dispatch only; signing and store uploads
# are manual owner steps (see release.yml) and never belong here.
# Pins: Flet 1.0.3, Python 3.13, Flutter 3.44.8; actions use release commit SHAs.
# A private repository pays for macOS minutes, so there the jobs run only on manual dispatch; the
# local CI mirror (scripts/ci_local.sh) runs the same checks before every push.

name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  FLUTTER_VERSION: "3.44.8"
  UV_VERSION: "0.12.15"

jobs:
  checks:
    name: lint-type-test-scan
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 60
    # The documented install uses uv's managed Python; the usage hook refuses the runner's shared
    # tool-cache interpreter.
    env:
      UV_PYTHON: "3.13"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Changes reader runs only a git that its owner alone can modify and needs 2.45 or newer.
      # Homebrew's folder is group-writable, so the tests use Apple's git from the newest Xcode.
      - name: Git 2.45 or newer from the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$newest"
          version=$(/usr/bin/git --version | sed -E 's/^git version ([0-9]+)\.([0-9]+).*/\1 \2/')
          echo "$newest: $(/usr/bin/git --version)"
          set -- $version
          if [ "$1" -lt 2 ] || { [ "$1" -eq 2 ] && [ "$2" -lt 45 ]; }; then
            echo "::error::Apple git is older than 2.45; the Changes tests cannot run" >&2
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Locked dependency resolution
        run: uv sync --locked --extra companion --group dev

      - name: Pinned environment check
        run: uv run python scripts/verify_versions.py

      - name: Lint
        run: uv run ruff check --no-cache .

      - name: Format check
        run: uv run ruff format --check --no-cache .

      - name: Static types
        run: uv run mypy src

      - name: Import contracts
        run: uv run lint-imports --config pyproject.toml

      - name: Unit and architecture tests
        run: uv run pytest tests/unit tests/architecture -q

      - name: Contract, integration and security tests
        run: uv run pytest tests/contracts tests/integration tests/security -q

      - name: UI scenario tests (headless)
        run: uv run pytest tests/ui -q

      - name: Secret scan
        run: uv run python scripts/scan_release_secrets.py

      - name: License inventory (fails on unknown)
        run: uv run python scripts/license_inventory.py --out sbom.json

      - name: Dependency vulnerability audit
        run: |
          uv export --locked --no-hashes --no-emit-project --extra companion --format requirements-txt > requirements-audit.txt
          uvx pip-audit==2.9.0 -r requirements-audit.txt --no-deps --disable-pip

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 30

  flutter-tests:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    name: flutter extension and patch tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Terminal extension tests
        working-directory: extensions/terminal/src/flutter/relaydeck_terminal
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          dart format --output=none --set-exit-if-changed lib test tool
          flutter test
          flutter test --no-pub "$GITHUB_WORKSPACE/tests/native/flet_paste_menu_test.dart"

      - name: Notifications extension tests
        working-directory: extensions/notifications/src/flutter/relaydeck_notifications
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          dart format --output=none --set-exit-if-changed lib test
          flutter test

      - name: Reconnect patch tests (pristine Flet plus the shipped diff)
        env:
          FLUTTER: flutter
        run: bash patches/flet-reconnect-merge-patch/apply.sh --test

  build-web:
    name: web packaging smoke (static Pyodide, NOT dynamic deploy)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [checks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Locked dependency resolution
        run: uv sync --locked --extra companion --group dev

      - name: Build static web artifact (smoke only)
        run: uv run flet build web --yes

      - name: Upload static web bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-static-smoke-${{ github.sha }}
          path: build/web
          retention-days: 14

  build-android:
    name: android unsigned packaging (AAB)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [checks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Locked dependency resolution
        run: uv sync --locked --extra companion --group dev

      - name: Build unsigned AAB (test packaging only)
        # No --android-signing-* flags: this is unsigned/test packaging.
        # Production signing is a manual owner operation (see release.yml).
        # `flet build aab` builds a package; it never publishes to a store.
        run: uv run flet build aab --python-version 3.13 --yes

      - name: Emit build manifest with AAB hash
        run: |
          AAB=$(ls build/aab/*.aab | head -n 1)
          uv run python scripts/build_manifest.py --aab "$AAB" --out build-manifest.json
          cat build-manifest.json

      - name: Upload unsigned AAB + manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unsigned-aab-${{ github.sha }}
          path: |
            build/aab/*.aab
            build-manifest.json
          retention-days: 30
