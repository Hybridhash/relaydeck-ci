containers = ["relaydeck.gateway.features.metadata"]
layers = ["(adapters)", "api", "events:inventory:metadata_follower:metadata_streams:(service)", "(ports)", "metadata_state:(model)"]
exhaustive = true
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Gateway notifications layer order"
type = "layers"
containers = ["relaydeck.gateway.features.notifications"]
layers = ["adapters", "api", "service:worker:outbox_io:transitions", "ports", "model"]
exhaustive = true
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
    "relaydeck.gateway.features.notifications.api -> relaydeck.gateway.features.notifications.adapters.fcm",  # Permanent public entry exposes the declared adapter objects.
    "relaydeck.gateway.features.notifications.api -> relaydeck.gateway.features.notifications.adapters.sqlite_store",  # Permanent public entry exposes the declared adapter objects.
    "relaydeck.gateway.features.notifications.api -> relaydeck.gateway.features.notifications.adapters.webpush",  # Permanent public entry exposes the declared adapter objects.
    "relaydeck.gateway.features.notifications.api -> relaydeck.gateway.features.notifications.adapters.webpush_store",  # Permanent public entry exposes the declared adapter objects.
]

